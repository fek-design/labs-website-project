schema: spec-driven

context: |
  Tech Stack: Next.js (App Router), React, Tailwind CSS, Prisma ORM (local MySQL), NextAuth (Credentials).
  Animation: motion/react (micro-interactions), gsap & @gsap/react (macro/scroll telemetry).
  Domain: Zealand Labs Infrastructure (Makerspace & Medialab POS System).
  Mandate: Strict "Zero Cloud Dependency". All data, images, and logic run on a local network.
  Security: Zero student accounts. Admins only.
  
  Open Spec Design System (Visual Contract):
  - Base Floor: #000000 (Brand Black). No white/light backgrounds globally unless for strict pattern breaking.
  - Accents (CMYK): #FFED00 (Yellow), #E6007E (Pink), #009FE3 (Cyan). Used for telemetry and active states.
  - Surfaces: #141414 (Card base), #262626 (Border).
  - Typography: 'Stack Sans Notch'. Hero headers use massive scaling (text-6xl+) and mix-blend-mode overlay.
  - Geometry: Buttons are full pill (rounded-full). Cards use 1.25rem radius (rounded-3xl).

rules:
  components:
    - Never use standard hex codes in inline styles; rely strictly on the @theme variables defined in app/globals.css.
    - Buttons must flip CMYK pairs on hover.
    - Grid layouts must use Tailwind CSS for asymmetrical bento structures.
  database_actions:
    - All Prisma mutations must be executed strictly within Next.js Server Actions ('use server').
    - Every Server Action must enforce a NextAuth Admin session check before executing logic.
    - Any Server Action that modifies inventory or loans must append a record to AuditLog.
  file_handling:
    - Do not implement cloud storage. All image uploads must save locally to /public/uploads.

operations:
  apply:
    guidance:
      - Validate that no cloud services are accidentally imported.
      - Ensure strict separation between UI client components and secured server actions.